sonar.projectKey=Ghost-Assembly_quickts
sonar.organization=ghost-assembly

sonar.sources=modules,extension.js,prefs.js
sonar.tests=tests
sonar.exclusions=node_modules/**,coverage/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The same two files as coverage.exclude in vitest.config.js, which carries
# the reasoning for both. That list also has tests/**, which needs no entry
# here: sonar.sources above leaves it out.
sonar.coverage.exclusions=prefs.js,modules/io.js
